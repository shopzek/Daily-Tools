<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DailyTools Blog – All Tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff;
    color: #000;
    transition: background 0.3s, color 0.3s;
  }

  body.dark {
    background: #121212;
    color: #f1f1f1;
  }

  /* ================= HEADER ================= */
  .main-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: #f8f8f8;
    flex-wrap: wrap;
  }

  body.dark .main-header {
    background: #1e1e1e;
  }

  .logo {
    font-size: 1.5rem;
    font-weight: bold;
    text-decoration: none;
    color: #007bff;
    flex: 1;
  }

  .navbar {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex: 1;
  }

  .navbar a {
    color: #007bff;
    text-decoration: none;
    font-weight: 500;
    font-size: 14px;
  }

  .navbar a:hover,
  .navbar a:focus {
    text-decoration: underline;
    outline: none;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    justify-content: flex-end;
  }

  /* Search Box with Transition */
  .search-box {
    display: flex;
    align-items: center;
    background: #f0f0f0;
    border-radius: 6px;
    padding: 5px 10px;
    transition: background 0.3s, box-shadow 0.3s;
  }

  .search-box:hover,
  .search-box:focus-within {
    background: #e0e0e0;
    box-shadow: 0 0 5px rgba(0,0,0,0.2);
  }

  body.dark .search-box {
    background: #333;
  }

  body.dark .search-box:hover,
  body.dark .search-box:focus-within {
    background: #444;
    box-shadow: 0 0 5px rgba(255,255,255,0.2);
  }

  .search-box input {
    border: none;
    outline: none;
    margin-left: 5px;
    height: 28px;
    font-size: 13px;
    background: transparent;
    color: inherit;
    transition: width 0.3s ease;
  }

  .search-box input:focus {
    width: 150px;
  }

  /* Dark Mode Toggle */
  .dark-btn {
    height: 38px;
    width: 38px;
    font-size: 18px;
    border-radius: 6px;
    cursor: pointer;
    border: none;
    background-color: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.3s;
  }

  .dark-btn:hover,
  .dark-btn:focus {
    background-color: #d0d0d0;
    outline: none;
  }

  body.dark .dark-btn {
    background-color: #333;
    color: #fff;
  }

  body.dark .dark-btn:hover,
  body.dark .dark-btn:focus {
    background-color: #444;
  }

  /* ================= HERO ================= */
  .hero {
    text-align: center;
    padding: 40px 20px;
  }

  .hero h1 {
    margin: 0 0 10px;
    font-size: 2rem;
  }

  .hero p {
    margin: 0;
    font-size: 14px;
    color: #555555;
  }

  body.dark .hero p {
    color: #ccc;
  }

  /* ================= BLOG GRID ================= */
  .container {
    max-width: 1200px;
    margin: 20px auto;
    padding: 0 20px;
  }

  .blog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }

  .blog-card {
    background: #f0f0f0;
    padding: 20px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 2px 5px rgb(0 0 0 / 0.1);
    transition: box-shadow 0.3s;
  }

  .blog-card:hover,
  .blog-card:focus-within {
    box-shadow: 0 5px 15px rgb(0 0 0 / 0.2);
  }

  body.dark .blog-card {
    background: #1e1e1e;
    color: #f1f1f1;
    box-shadow: none;
  }

  body.dark .blog-card:hover,
  body.dark .blog-card:focus-within {
    box-shadow: 0 5px 15px rgb(255 255 255 / 0.15);
  }

  .blog-card h3 {
    margin-top: 0;
    font-size: 1.1rem;
    font-weight: 600;
    color: #222;
  }

  body.dark .blog-card h3 {
    color: #e0e0e0;
  }

  .blog-card p {
    font-size: 14px;
    color: #555555;
    line-height: 1.5;
    margin-bottom: 15px;
    flex-grow: 1;
  }

  body.dark .blog-card p {
    color: #aaa;
  }

  .blog-card a {
    text-decoration: none;
    color: #007bff;
    font-weight: 600;
    font-size: 14px;
    margin-top: auto;
    align-self: flex-start;
  }

  .blog-card a:hover,
  .blog-card a:focus {
    text-decoration: underline;
    outline: none;
  }

  /* ================= FOOTER ================= */
  .site-footer {
    text-align: center;
    padding: 10px 0; /* Reduced padding to fix big height */
    background: #f8f8f8;
    margin-top: 40px;
    font-size: 13px;
    color: #555555;
  }

  body.dark .site-footer {
    background: #1e1e1e;
    color: #aaa;
  }

  .footer-nav {
    margin-top: 5px;
  }

  .footer-nav a {
    color: #007bff;
    text-decoration: none;
    margin: 0 5px;
    font-weight: 500;
  }

  .footer-nav a:hover {
    text-decoration: underline;
  }

  /* ================= RESPONSIVE ================= */
  @media (max-width: 768px) {
    .main-header {
      flex-wrap: wrap;
    }

    .logo {
      flex: 1 1 100%;
      text-align: left;
      margin-bottom: 10px;
    }

    .header-right {
      order: 2;
      width: 100%;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .navbar {
      order: 1;
      flex: 1 1 100%;
      justify-content: flex-start;
      gap: 15px;
      margin-bottom: 10px;
    }
  }
</style>
</head>

<body>
<header class="main-header" role="banner">
  <a href="index.html" class="logo" aria-label="DailyTools Home">🚀 DailyTools</a>

  <nav class="navbar" role="navigation" aria-label="Main Navigation">
    <a href="index.html">Home</a>
    <a href="blog.html">Blog</a>
  </nav>

  <div class="header-right">
    <div class="search-box" role="search">
      🔍
      <input type="search" id="search" placeholder="Search tools..." aria-label="Search tools" />
    </div>

    <button onclick="toggleDark()" class="dark-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
      🌙
    </button>
  </div>
</header>

<section class="hero" role="banner">
  <h1>DailyTools Blog</h1>
  <p>All our tools, guides &amp; tips in one place</p>
</section>

<main class="container blog-grid" role="main" aria-live="polite">
  <!-- TOOL CARDS GO HERE (unchanged) -->
</main>

<footer class="site-footer" role="contentinfo">
  <p>© 2026 DailyTools — Free & Private Online Utilities</p>
  <nav class="footer-nav">
    <a href="about.html">About</a> |
    <a href="privacy-policy.html">Privacy Policy</a> |
    <a href="terms.html">Terms</a> |
    <a href="contact.html">Contact</a>
  </nav>
</footer>

<script>
  // Toggle dark mode
  function toggleDark() {
    document.body.classList.toggle("dark");
  }

  // Search filter
  document.getElementById("search").addEventListener("input", function () {
    const value = this.value.toLowerCase();
    document.querySelectorAll(".blog-card").forEach(card => {
      card.style.display = card.innerText.toLowerCase().includes(value) ? "block" : "none";
    });
  });
</script>
</body>
</html>
