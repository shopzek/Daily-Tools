<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About – DailyTools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO / Adsense -->
  <meta name="description" content="About DailyTools – a free online platform offering secure, fast, and browser-based tools for documents, images, text, and productivity.">
  <meta name="keywords" content="free tools, online tools, pdf tools, image tools, text tools">

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #555;
      --footer: #f3f4f6;
    }

    body.dark {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #f1f1f1;
      --muted: #aaa;
      --footer: #1e1e1e;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 0;
      color: var(--text);
      transition: background .3s, color .3s;
    }

    /* ================= HEADER ================= */
    header {
      background: #f3f4f6;
      padding: 16px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    body.dark header {
      background: #1e1e1e;
    }

    .logo {
      color: #007bff;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex: 1;
    }

    nav a {
      color: #007bff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ===== SEARCH (MATCH INDEX.HTML) ===== */
    .search-box {
      display: flex;
      align-items: center;
      background: #f0f0f0;
      border-radius: 6px;
      padding: 6px 12px;
      min-width: 260px;
      transition: background .3s ease, box-shadow .3s ease;
    }

    .search-box:hover {
      box-shadow: 0 0 0 2px rgba(0,123,255,.15);
    }

    .search-box input {
      border: none;
      outline: none;
      margin-left: 6px;
      background: transparent;
      width: 100%;
      font-size: 14px;
    }

    body.dark .search-box {
      background: #2a2a2a;
      color: #fff;
    }

    /* ===== DARK TOGGLE (ANIMATED) ===== */
    .dark-btn {
      height: 38px;
      width: 38px;
      font-size: 18px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      background-color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        background-color .3s ease,
        transform .2s ease,
        box-shadow .2s ease;
    }

    .dark-btn:hover {
      background-color: #e0e0e0;
      transform: scale(1.05);
      box-shadow: 0 4px 10px rgba(0,0,0,.15);
    }

    body.dark .dark-btn {
      background-color: #333;
      color: #fff;
    }

    body.dark .dark-btn:hover {
      background-color: #444;
    }

    /* ================= MAIN ================= */
    .page-wrapper {
      max-width: 900px;
      margin: 60px auto;
      background: var(--card);
      padding: 40px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    h1, h2 {
      color: #007bff;
      margin-bottom: 16px;
    }

    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 16px;
    }

    ul {
      margin-left: 20px;
      margin-bottom: 20px;
    }

    li {
      margin-bottom: 10px;
    }

    /* ================= FOOTER ================= */
    footer {
      text-align: center;
      padding: 30px 20px;
      background: var(--footer);
      margin-top: 40px;
      font-size: 14px;
      color: var(--muted);
    }

    footer a {
      color: #007bff;
      text-decoration: none;
      margin: 0 6px;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header>
  <a href="index.html" class="logo">🚀 DailyTools</a>

  <nav>
    <a href="index.html">Home</a>
    <a href="blog.html">Blog</a>
  </nav>

  <div class="header-actions">
    <div class="search-box">
      🔍
      <input type="text" placeholder="Search tools..." aria-label="Search tools">
    </div>

    <button onclick="toggleDark()" class="dark-btn" aria-label="Toggle dark mode">
      🌙
    </button>
  </div>
</header>

<!-- MAIN CONTENT (UNCHANGED) -->
<main class="page-wrapper">
  <!-- your content remains exactly the same -->
  <!-- (intentionally not repeated here for clarity) -->
</main>

<!-- FOOTER -->
<footer>
  © 2026 DailyTools •
  <a href="about.html">About</a> |
  <a href="privacy-policy.html">Privacy Policy</a> |
  <a href="terms.html">Terms & Conditions</a> |
  <a href="contact.html">Contact</a>
</footer>

<script>
  function toggleDark() {
    document.body.classList.toggle('dark');
  }
</script>

</body>
</html>
